openapi: 3.1.0
info:
  title: 随行帮办 AssistGuide API
  version: 0.9.0
  description: |
    面向数字弱势群体的 AI 跨应用办事导航 Agent。

    设计约束：所有写操作必须携带会话 id；`/api/guide` 返回的目标控件一定存在于
    请求所声明的屏幕中，否则服务端拒绝返回该动作（返回 500 并记录契约违例）。
servers:
  - url: http://127.0.0.1:8787
    description: 本地演示环境

tags:
  - name: session
    description: 会话与画像
  - name: assist
    description: 意图、引导、填表、救援
  - name: memory
    description: 长期档案：可查、可改、可忘
  - name: ops
    description: 运维与观测

paths:
  /healthz:
    get:
      tags: [ops]
      summary: 健康检查
      responses:
        '200':
          description: 服务可用
          content:
            application/json:
              schema:
                type: object
                required: [status, uptimeSeconds, llmAvailable, version]
                properties:
                  status: { type: string, enum: [ok] }
                  uptimeSeconds: { type: integer }
                  llmAvailable: { type: boolean, description: 模型通道是否启用；false 表示走规则兜底 }
                  version: { type: string }

  /api/meta:
    get:
      tags: [ops]
      summary: 产品元信息与模型状态
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  product: { type: string }
                  version: { type: string }
                  llm:
                    type: object
                    properties:
                      available: { type: boolean }
                      model: { type: string }
                      mode: { type: string }
                  guardrailMode: { type: string, enum: [strict, assistive] }
                  screens: { type: integer }

  /api/tasks:
    get:
      tags: [ops]
      summary: 支持的事项清单
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TaskSpecSummary' }

  /api/screens/{id}:
    get:
      tags: [ops]
      summary: 读取屏幕模型（供调试与第三方复现）
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, example: gov.home }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScreenModel' }
        '404':
          description: 屏幕不存在

  /api/session:
    post:
      tags: [session]
      summary: 创建会话
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                profile: { $ref: '#/components/schemas/UserProfilePatch' }
                ownerId:
                  type: string
                  minLength: 8
                  maxLength: 64
                  description: 本机档案编号（前端生成、存 localStorage）。传了就带上这台设备记住的档案；不传即「不留名」，只活在本次会话
      responses:
        '200':
          description: 会话已创建
          content:
            application/json:
              schema:
                type: object
                required: [sessionId, profile, screenId, tasks]
                properties:
                  sessionId: { type: string, format: uuid }
                  profile: { $ref: '#/components/schemas/UserProfile' }
                  screenId: { type: string }
                  tasks:
                    type: array
                    items: { $ref: '#/components/schemas/TaskSpecSummary' }
                  memory: { $ref: '#/components/schemas/ProfileMemoryView' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/intent:
    post:
      tags: [assist]
      summary: 口语 → 结构化意图
      description: 优先采用模型判断；模型不可用或输出非法时降级到关键词规则。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId, utterance]
              properties:
                sessionId: { type: string }
                utterance: { type: string, minLength: 1, maxLength: 300 }
      responses:
        '200':
          description: 识别结果；ok=false 时附带候选事项供用户澄清
          content:
            application/json:
              schema:
                type: object
                required: [ok, mode, intent, suggestions, message, source]
                properties:
                  ok: { type: boolean }
                  mode:
                    type: string
                    enum: [guide, answer]
                    description: |
                      guide＝进入办理引导；answer＝问答通道作答（此时 intent 为 null）。
                  answer:
                    type: object
                    description: 仅 mode=answer 时出现
                    properties:
                      text: { type: string, description: 主体回答，口语，160 字以内 }
                      points:
                        type: array
                        items: { type: string }
                      relatedTaskId:
                        type: string
                        description: 这件事本产品能直接办时给出，前端提供「直接带着我办」
                      source: { type: string, enum: [llm, rule] }
                      latencyMs: { type: integer }
                  intent:
                    oneOf:
                      - $ref: '#/components/schemas/Intent'
                      - type: 'null'
                  suggestions:
                    type: array
                    items: { type: string }
                  message: { type: string }
                  source: { type: string, enum: [llm, rule, none] }
                  planned:
                    type: object
                    description: |
                      仅当事项未收录、由模型现场规划时出现。
                      `issues` 非空表示有步骤被屏幕契约或语义闸门挡下（此时 coverage 必为 partial）。
                    properties:
                      title: { type: string }
                      coverage: { type: string, enum: [full, partial] }
                      steps: { type: integer }
                      issues:
                        type: array
                        items: { type: string }
                      injectedGuardrails:
                        type: array
                        items: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/SessionNotFound' }

  /api/guide:
    post:
      tags: [assist]
      summary: 当前屏幕 → 下一步动作
      description: |
        核心接口。已收录事项的决策由确定性流程引擎给出，模型仅生成措辞；
        未收录事项则由模型规划、经契约校验后生成的流程驱动。
        返回的 `targetControlId` 一定存在于请求声明的 `screenId` 中。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId, screenId]
              properties:
                sessionId: { type: string }
                screenId: { type: string }
                slots:
                  type: object
                  additionalProperties: { type: string, maxLength: 60 }
                attemptsOnScreen: { type: integer, minimum: 0, maximum: 50, default: 0 }
                asksForHelp: { type: boolean, default: false }
                tappedControlId:
                  type: string
                  maxLength: 60
                  description: |
                    用户刚刚点下的控件 id。用于「点到位但页面没跳转」的情形
                    （入口未收录、或对方 App 停在当前页），避免服务端反复指同一处。
                    只有等于当前应指控件时才计为完成。
      responses:
        '200':
          description: 引导动作
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GuideAction' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/SessionNotFound' }

  /api/slots/extract:
    post:
      tags: [assist]
      summary: 口语 → 表单值
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId, utterance]
              properties:
                sessionId: { type: string }
                utterance: { type: string, maxLength: 300 }
                slot: { type: string, description: 目标槽位，可省略 }
                label: { type: string, description: 当前输入框的界面文案 }
      responses:
        '200':
          description: 抽取结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  slots:
                    type: object
                    additionalProperties: { type: string }
                  confidence: { type: number, minimum: 0, maximum: 1 }
                  source: { type: string, enum: [llm, rule] }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/rescue:
    post:
      tags: [assist]
      summary: 生成人工求助话术
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId]
              properties:
                sessionId: { type: string }
      responses:
        '200':
          description: 话术
          content:
            application/json:
              schema:
                type: object
                properties:
                  script: { type: string }
                  hotline: { type: string }

  /api/session/{id}/profile:
    get:
      tags: [memory]
      summary: 我记着您什么
      description: 把长期档案摊开给老人看。返回值同时给出到期时间——记多久、什么时候忘，都该说清楚。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileMemoryView' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [memory]
      summary: 改一项记忆（改完立即影响引导措辞）
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                displayName: { type: string, maxLength: 20 }
                age: { type: integer, minimum: 40, maximum: 110 }
                digitalLiteracy: { type: string, enum: [low, medium, high] }
                livingAlone: { type: boolean }
                hearingImpaired: { type: boolean }
      responses:
        '200':
          description: 已记住
          content:
            application/json:
              schema:
                type: object
                properties:
                  view: { $ref: '#/components/schemas/ProfileMemoryView' }
                  message: { type: string, description: 回给老人的一句话，例如「以后我说话更慢、更短」 }
                  profile: { $ref: '#/components/schemas/UserProfile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [memory]
      summary: 忘掉我的信息
      description: 删档案并断开本机会话的关联，会话退回默认档案。合规要求，不是可选功能。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 已删除
          content:
            application/json:
              schema:
                type: object
                properties:
                  forgotten: { type: boolean, description: 之前是否真的有一份档案 }
                  memory: { $ref: '#/components/schemas/ProfileMemoryView' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/session/{id}/metrics:
    get:
      tags: [assist]
      summary: 会话指标
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionMetrics' }
        '404': { $ref: '#/components/responses/SessionNotFound' }

  /api/metrics:
    get:
      tags: [ops]
      summary: 全局埋点计数
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: object
                    additionalProperties: { type: integer }
                  at: { type: integer }

  /api/preflight:
    post:
      tags: [guardian]
      summary: 办前体检（提交前的模拟审核）
      description: 用归集到的材料（含有效期与归属人）与档案槽位判断会不会被退回。结论是预判，不冒充审批结果。
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                taskId: { type: string, enum: [allowance.renew, pension.qualify, medical.filing, utility.pay] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreflightResult' }
        '404':
          description: 该事项未录入受理要求，不做体检

  /api/lifecycle:
    get:
      tags: [guardian]
      summary: 守护日历（到期、年检、复核）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LifeScan' }

  /api/scam:
    post:
      tags: [guardian]
      summary: 可疑话术判别
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, maxLength: 300 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScamAssessment' }

  /api/collab/open:
    post:
      tags: [guardian]
      summary: 生成或复用协办码
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId]
              properties:
                sessionId: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollabTicket' }
        '404': { $ref: '#/components/responses/SessionNotFound' }

  /api/collab/join:
    post:
      tags: [guardian]
      summary: 家人接入协办
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, helper]
              properties:
                code: { type: string, minLength: 4, maxLength: 10 }
                helper: { type: string, maxLength: 10 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollabTicket' }
        '409':
          description: 码过期、已结束或不存在

  /api/collab/hint:
    post:
      tags: [guardian]
      summary: 家人发一句话（只是提示，不是代按）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, text]
              properties:
                code: { type: string }
                text: { type: string, maxLength: 40 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollabTicket' }
        '409':
          description: 未接入、已结束、超长或超出条数上限

  /api/collab/close:
    post:
      tags: [guardian]
      summary: 结束协办
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollabTicket' }
        '404':
          description: 码不存在

  /api/feedback:
    post:
      tags: [quality]
      summary: 记录办件结果反馈
      description: |
        结果页问一句「这件事办成了吗」。三档不对等：
        - worked：办成了，用于算真实一次办成率；
        - failed：没办成，但指引没说错（外部原因）；
        - wrong：**它说错了**，唯一能反哺提示词与知识库的信号。
        允许重复提交（改主意），后到覆盖前一次结论，但埋点不去重。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId, verdict]
              properties:
                sessionId: { type: string, minLength: 8, maxLength: 64 }
                verdict: { type: string, enum: [worked, failed, wrong] }
                note: { type: string, maxLength: 200 }
      responses:
        '200':
          description: 返回更新后的会话指标
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionMetrics' }
        '404':
          description: 会话不存在或已过期
components:
  responses:
    BadRequest:
      description: 请求参数不合法
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string, enum: [INVALID_ARGUMENT] }
              message: { type: string }
              detail: {}
    SessionNotFound:
      description: 会话不存在或已过期
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string, enum: [SESSION_NOT_FOUND] }
              message: { type: string }

  schemas:
    ProfileMemoryView:
      type: object
      required: [memory, source]
      properties:
        memory:
          type: object
          description: 白名单字段。身份证号、手机号、家庭收入不在其中——它们只在单次办理里过一遍内存
          properties:
            displayName: { type: string }
            age: { type: integer }
            region: { type: string }
            digitalLiteracy: { type: string, enum: [low, medium, high] }
            livingAlone: { type: boolean }
            hearingImpaired: { type: boolean }
        source:
          type: string
          enum: [stored, session]
          description: stored = 这次是读了上次记住的；session = 这次才建，还没落盘
        updatedAt: { type: integer, description: 毫秒时间戳 }
        expiresAt: { type: integer, description: 毫秒时间戳；过期后不再参与引导措辞 }

    PreflightResult:
      type: object
      required: [taskId, taskTitle, verdict, score, onePassRate, items, blockers, warnings, summary, fixes, basis]
      properties:
        taskId: { type: string }
        taskTitle: { type: string }
        verdict: { type: string, enum: [ready, 'at-risk', blocked] }
        score: { type: integer, minimum: 0, maximum: 100 }
        onePassRate: { type: integer, description: 估算的一次办成率（百分比） }
        items:
          type: array
          items:
            type: object
            properties:
              materialId: { type: string }
              name: { type: string }
              level: { type: string, enum: [blocker, warning, pass] }
              detail: { type: string }
              daysLeft: { type: integer }
        blockers:
          type: array
          items: { type: object }
        warnings:
          type: array
          items: { type: object }
        summary: { type: string }
        fixes:
          type: array
          items:
            type: object
            properties:
              label: { type: string }
              kind: { type: string, enum: [renew, obtain, owner, confirm] }
              where: { type: string }
              script: { type: string }
        basis: { type: string, description: 判断依据，含「以受理窗口为准」}

    LifeScan:
      type: object
      properties:
        entries:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              title: { type: string }
              dueAt: { type: string, format: date }
              kind: { type: string, enum: [deadline, annual, review, bill] }
              consequence: { type: string }
              daysLeft: { type: integer }
              urgency: { type: string, enum: [overdue, urgent, soon, later] }
              phrase: { type: string }
              actionLabel: { type: string }
              relatedTaskId: { type: string }
              targetScreenId: { type: string }
        next: { type: object, nullable: true }
        dueSoon: { type: integer }
        overdue: { type: integer }
        summary: { type: string }

    ScamAssessment:
      type: object
      properties:
        level: { type: string, enum: [high, medium, low, none] }
        score: { type: integer }
        hits:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              label: { type: string }
              weight: { type: integer }
        alreadyExposed: { type: boolean, description: 钱或验证码已经给出去了，走止损路径 }
        verdict: { type: string }
        advice:
          type: array
          items: { type: string }
        hotlines:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              phone: { type: string }
        familyNote: { type: string }
        context:
          type: array
          items: { type: string }

    CollabTicket:
      type: object
      properties:
        code: { type: string, description: 6 位，不含 0/O/1/I }
        sessionId: { type: string }
        createdAt: { type: integer }
        expiresAt: { type: integer }
        status: { type: string, enum: [waiting, joined, closed] }
        helper: { type: string, nullable: true }
        screenTitle: { type: string, description: 老人当前所在页，家人只读 }
        taskTitle: { type: string, nullable: true }
        hints:
          type: array
          description: 家人的提示。注意只有文本，没有控件 id——代按在数据层面不存在
          items:
            type: object
            properties:
              at: { type: integer }
              from: { type: string }
              text: { type: string }

    UserProfilePatch:
      type: object
      properties:
        displayName: { type: string, maxLength: 20 }
        age: { type: integer, minimum: 40, maximum: 110 }
        region: { type: string, maxLength: 40 }
        livingAlone: { type: boolean }
        digitalLiteracy: { type: string, enum: [low, medium, high] }
        hearingImpaired: { type: boolean }

    UserProfile:
      type: object
      properties:
        displayName: { type: string }
        age: { type: integer }
        region: { type: string }
        digitalLiteracy: { type: string, enum: [low, medium, high] }
        livingAlone: { type: boolean }
        hearingImpaired: { type: boolean }
        dialect: { type: string }

    TaskSpecSummary:
      type: object
      properties:
        taskId:
          type: string
          enum: [allowance.renew, pension.qualify, medical.filing, utility.pay]
        title: { type: string }
        category: { type: string }
        hotkey: { type: string }
        requiredDocs:
          type: array
          items: { type: string }
        baselineSteps: { type: integer }
        baselineMs: { type: integer }
        pitfalls:
          type: array
          items: { type: string }

    Intent:
      type: object
      required: [taskId, confidence, restated, source]
      properties:
        taskId:
          type: string
          enum: [allowance.renew, pension.qualify, medical.filing, utility.pay]
        confidence: { type: number, minimum: 0, maximum: 1 }
        slots:
          type: object
          additionalProperties: { type: string }
        missingSlots:
          type: array
          items: { type: string }
        urgency: { type: string, enum: [normal, urgent] }
        restated: { type: string, description: 面向用户的一句话复述 }
        source: { type: string, enum: [llm, rule] }
        rawUtterance: { type: string }

    GuideAction:
      type: object
      required: [kind, instruction, speak, reason, confidence, stepLabel, progress, source, rescue, latencyMs]
      properties:
        kind:
          type: string
          enum: [tap, input, back, read, human-confirm, handoff]
          description: |
            tap=点击目标控件；input=在目标控件填值；back=要求返回；
            read=仅播报；human-confirm=护栏拦截，必须本人操作；handoff=转人工
        targetControlId:
          type: string
          description: 目标控件，保证存在于当前屏幕
        instruction: { type: string, maxLength: 60, description: 面向用户的大字指令 }
        speak: { type: string, maxLength: 40, description: 语音播报文本 }
        guardrail:
          type: string
          enum: [payment, identity, biometric, captcha, legal-consent, sensitive-info]
        fieldId: { type: string, description: 填表节点对应的输入框 id }
        prefill:
          type: object
          properties:
            value: { type: string }
            source: { type: string, enum: [profile, last-submission] }
            label: { type: string }
        reason: { type: string, description: 判断依据，用于审计与展示 }
        confidence: { type: number, minimum: 0, maximum: 1 }
        stepLabel: { type: string, example: 第 4 步 / 共 12 步 }
        progress:
          type: object
          properties:
            index: { type: integer }
            total: { type: integer }
        source: { type: string, enum: [llm, rule] }
        rescue:
          type: object
          properties:
            triggered: { type: boolean }
            kind: { type: string, enum: [wrong-screen, stuck, face-failed, blocked, none] }
            message: { type: string }
            script: { type: string }
        latencyMs: { type: integer }

    SessionMetrics:
      type: object
      properties:
        stepsGuided: { type: integer }
        wrongTurns: { type: integer }
        guardrailsTriggered: { type: integer }
        handoffs: { type: integer }
        elapsedMs: { type: integer }
        completed: { type: boolean }
        baselineSteps: { type: integer }
        baselineMs: { type: integer }

    ScreenModel:
      type: object
      properties:
        id: { type: string }
        app: { type: string }
        title: { type: string }
        semantics: { type: string }
        blocks:
          type: array
          items:
            type: object
            additionalProperties: true
        traps:
          type: array
          items: { type: string }
