name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 质量门禁（Node ${{ matrix.node }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 代码规范
        run: npm run lint

      - name: 类型检查
        run: npm run typecheck

      - name: 单元与接口测试
        run: npm run test

      - name: 生产构建
        run: npm run build

      - name: 产物大小
        run: |
          du -sh dist
          ls -lh dist

  smoke:
    name: 端到端冒烟（规则模式，无需模型密钥）
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: 启动服务（未配置密钥时自动降级为规则引擎）
        run: |
          node dist/server.js & echo $! > server.pid
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8787/healthz && break
            sleep 1
          done
      - name: 跑通全流程
        run: npm run smoke
      - name: 收敛
        if: always()
        run: kill "$(cat server.pid)" || true
